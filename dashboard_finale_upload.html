<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فضاء التكوين البيداغوجي توقرت - إدارة الملفات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  
<style>
/* ============================================================
   1. الإعدادات الأساسية والخلفية العصرية
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

body::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #f4f7f6;
  background-image: radial-gradient(#1E68E8 0.5px, transparent 0.5px), radial-gradient(#1E68E8 0.5px, #f4f7f6 0.5px);
  background-size: 20px 20px; background-position: 0 0, 10px 10px; opacity: 0.1;
  z-index: -1;
}

body { 
    font-family:'Cairo',sans-serif; margin:0; text-align:center; 
    min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; 
}

/* شريط التمرير */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #e2e8f0; }
::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }
body.swal2-shown { overflow-y: auto !important; padding-right: 0 !important; }

/* شريط الأخبار العلوي */
.news-ticker-container { 
    background-color: #0d47a1; color: #fff; width: 100%; min-height: 40px; 
    display: flex; align-items: center; justify-content: center; position: relative; 
    z-index: 20; padding: 5px 15px; font-size: 14px; font-weight: 600; 
}
.typewriter-text { display: inline-block; transition: opacity 0.5s; }
.typewriter-text.fade-out { opacity: 0; }

/* الهيدر العصري بتدرج أزرق فاخر */
header { 
    background: linear-gradient(135deg, #1E68E8 0%, #0d47a1 100%);
    position: relative; padding: 40px 20px 70px 20px; 
    border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; 
    box-shadow: 0 10px 30px rgba(30, 104, 232, 0.2); 
    z-index: 10; display: flex; flex-direction: column; align-items: center; 
}

header h1 { margin: 15px 0 5px 0; font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
header p { margin: 0; font-size: 15px; color: #bbdefb; font-weight: 600; }

/* زر الرجوع للوحة التحكم */
.btn-back { 
    position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.2); 
    backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); 
    padding: 8px 16px; border-radius: 25px; cursor: pointer; font-weight: 700; font-family: 'Cairo'; 
    z-index: 30; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    transition: 0.3s; font-size: 13px; 
}
.btn-back:hover { background: #fff; color: #1E68E8; transform: translateY(-2px); }

/* خدمات المراكز (شبكة البطاقات المتداخلة Overlapping) */
.services { 
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
    gap: 25px; padding: 0 20px 40px 20px; max-width: 1100px; width: 100%; 
    margin: -35px auto 0; /* التداخل لرفع البطاقات فوق الهيدر */
    z-index: 20; position: relative; flex: 1; 
}

.service { 
    background: #fff; border-radius: 20px; padding: 25px 20px; cursor: pointer; 
    box-shadow: 0 10px 20px rgba(0,0,0,0.06); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    display: flex; flex-direction: column; align-items: center; text-align: center; 
    border: 1px solid #e2e8f0; position: relative; overflow: hidden; 
}
.service::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    background: linear-gradient(90deg, #1E68E8, #3b82f6); transform: scaleX(0); transition: 0.4s ease; transform-origin: right;
}
.service:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(30, 104, 232, 0.15); border-color: #93c5fd; }
.service:hover::before { transform: scaleX(1); }
.service:active { transform: translateY(-3px) scale(0.98); }

.service-icon-wrapper {
    width: 70px; height: 70px; border-radius: 18px; background: #f0f7ff;
    display: flex; justify-content: center; align-items: center; margin-bottom: 15px;
    transition: 0.4s ease; border: 2px solid transparent;
}
.service:hover .service-icon-wrapper { background: #1E68E8; transform: rotate(10deg); border-color: #fff; box-shadow: 0 8px 15px rgba(30, 104, 232, 0.3); }

.service i { font-size: 32px; color: #1E68E8; transition: 0.4s ease; }
.service:hover i { color: #fff; }

.service h3 { color: #1e293b; font-size: 18px; font-weight: 800; margin: 0; line-height: 1.5; }

/* الأيقونات المنبثقة داخل النوافذ (مودال) */
.icon-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 10px; }
.icon-btn { 
    width: 140px; height: 130px; border-radius: 16px; border: 2px solid #e2e8f0; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    font-weight: 800; background: #fff; color: #1e293b; cursor: pointer; transition: .3s; 
    text-align: center; padding: 10px; font-size: 15px; 
}
.icon-btn i { font-size: 32px; margin-bottom: 12px; color: #1E68E8; transition: 0.3s; }
.icon-btn:hover { border-color: #1E68E8; box-shadow: 0 8px 20px rgba(30, 104, 232, 0.15); transform: translateY(-5px); color: #1E68E8; }
.icon-btn:hover i { transform: scale(1.1); }
.icon-btn:active { transform: scale(0.95); }

/* تنسيقات SweetAlert العصرية */
.swal2-popup { border-radius: 24px !important; padding: 0 !important; overflow: hidden; background: #fff !important; z-index: 999999 !important;}
.swal2-title { background: #f8fafc; padding: 20px !important; margin: 0 !important; font-size: 20px !important; border-bottom: 1px solid #e2e8f0; color: #0f172a !important; }
.swal2-html-container { padding: 20px !important; margin: 0 !important; }
.swal2-actions { background: #f8fafc; padding: 15px !important; margin: 0 !important; border-top: 1px solid #e2e8f0; }

.swal2-confirm { background:#102a43 !important; color:#fff !important; border-radius:12px !important; padding:10px 25px !important; font-family:'Cairo',sans-serif; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.15); margin: 5px !important; border:none !important; }
.swal2-confirm:hover { background: #243b53 !important; }
.swal2-deny { background: #1E68E8 !important; color: #fff !important; border-radius: 12px !important; padding: 10px 25px !important; font-family: 'Cairo', sans-serif; margin: 5px !important; border:none !important; }
.swal2-deny:hover { background: #1557c0 !important; }

footer { background: transparent; color: #64748b; padding: 20px; font-weight: 600; font-size: 13px; margin-top: auto; text-align: center; }

/* شاشة التحميل الدائرية */
.loader-spinner { border: 4px solid #e2e8f0; border-top: 4px solid #1E68E8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* ============================================================
   📱 تحسينات التجاوب (Media Queries)
   ============================================================ */
@media (max-width: 768px) {
    header { padding: 30px 15px 50px 15px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
    header h1 { font-size: 22px; }
    .btn-back { top: 15px; right: 15px; padding: 6px 12px; font-size: 12px; }
    .services { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: -25px; padding: 0 15px 30px 15px; }
    .service { padding: 20px 15px; }
    .service-icon-wrapper { width: 55px; height: 55px; margin-bottom: 10px; }
    .service i { font-size: 26px; }
    .service h3 { font-size: 15px; }
    .icon-btn { width: 45%; height: 110px; font-size: 14px; }
    .icon-btn i { font-size: 26px; }
}

@media (max-width: 400px) {
    .services { grid-template-columns: 1fr; }
    .icon-btn { width: 100%; height: 80px; flex-direction: row; gap: 15px; justify-content: flex-start; padding: 0 20px; }
    .icon-btn i { margin-bottom: 0; }
}
</style>
</head>

<body>

<div class="news-ticker-container">
    <span id="typewriter-text" class="typewriter-text"></span>
</div>

<header>
  <!-- زر العودة للوحة التحكم -->
  <button class="btn-back" onclick="goBack()"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة</button>

  <h1>إدارة الملفات والمقاييس</h1>
  <p>الرجاء اختيار المركز لإدارة ملفاته ومقاييسه</p>
</header>

<!-- قسم عرض المراكز ديناميكياً -->
<section id="centers-container" class="services">
    <div style="grid-column: 1/-1; padding: 50px;">
        <div class="loader-spinner"></div>
        <p style="color:#1E68E8; font-weight:bold; margin-top:15px;">جاري جلب المراكز المعتمدة...</p>
    </div>
</section>

<footer>© 2026 مديرية التربية لولاية توقرت | فضاء التكوين البيداغوجي | جميع الحقوق محفوظة</footer>

<script>
// ==================== 1. الحماية وإعدادات الجلسة ====================
const userEmpId = sessionStorage.getItem("userEmpId");
const inspectorCenter = sessionStorage.getItem("inspectorCenter");

if (!userEmpId) { window.location.href = "index_2.html"; }

function goBack() {
    if (userEmpId === "ADMIN_ACCESS") window.location.href = "admin_dashboard.html";
    else window.location.href = "inspector_dashboard.html";
}

// ==================== فحص صلاحيات المسؤول الإداري ====================
async function checkUserPermissions() {
    if (userEmpId !== "ADMIN_ACCESS") {
        try {
            const adminDoc = await db.collection("center_admins").doc(String(userEmpId)).get();
            if (adminDoc.exists) {
                const data = adminDoc.data();
                if (data.jobTitle === "المسؤول الإداري") {
                    document.body.innerHTML = ""; 
                    Swal.fire({
                        icon: 'error',
                        title: 'صلاحيات مقيدة',
                        text: 'عذراً أستاذي الكريم، إدارة المراكز وملفات المقاييس هي صلاحية حصرية للمسؤول البيداغوجي.',
                        allowOutsideClick: false,
                        confirmButtonText: 'العودة للوحة التحكم',
                        confirmButtonColor: '#102a43'
                    }).then(() => {
                        window.location.href = "inspector_dashboard.html";
                    });
                    return false;
                }
            }
        } catch(e) {
            console.warn("خطأ في التحقق من الصلاحيات:", e);
        }
    }
    return true;
}

// ==================== 2. إعدادات Firebase والبيانات المركزية ====================
const firebaseConfig = {
  apiKey: "AIzaSyBNBrVpBK8p_WWNwNhSH-mZ6NXOyr2TLhI",
  authDomain: "voyage-touggourt-48755.firebaseapp.com",
  projectId: "voyage-touggourt-48755",
  storageBucket: "voyage-touggourt-48755.firebasestorage.app",
  messagingSenderId: "712694455348",
  appId: "1:712694455348:web:5b4e8df57347edf944fe61"
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.firestore();

let SITE_SETTINGS = null;

// تعريف الأيقونات الثابتة للأطوار والتخصصات
const ICONS = {
    levels: {
        'primary': { name: 'الطور الابتدائي', icon: 'fa-child-reaching' },
        'middle': { name: 'الطور المتوسط', icon: 'fa-school' },
        'secondary': { name: 'الطور الثانوي', icon: 'fa-user-graduate' }
    },
    specs: {
        'arabic': { name: 'اللغة العربية', icon: 'fa-book-open' },
        'french': { name: 'اللغة الفرنسية', icon: 'fa-language' },
        'english': { name: 'اللغة الإنجليزية', icon: 'fa-font' },
        'sport': { name: 'التربية البدنية والرياضة', icon: 'fa-person-running' },
        'others': { name: 'باقي التخصصات', icon: 'fa-layer-group' }
    }
};

// جلب الإعدادات وبناء الأزرار
function initSiteSettings() {
    const docRef = db.collection("site_settings").doc("main");
    
    docRef.onSnapshot(async (doc) => { 
        if (doc.exists) {
            SITE_SETTINGS = doc.data();
            
            if (userEmpId !== "ADMIN_ACCESS") {
                try {
                    const adminDoc = await db.collection("center_admins").doc(String(userEmpId)).get();
                    if (adminDoc.exists && adminDoc.data().jobTitle === "المسؤول الإداري") {
                        document.body.innerHTML = ""; 
                        Swal.fire({
                            icon: 'error',
                            title: 'صلاحيات مقيدة',
                            text: 'عذراً أستاذي الكريم، إدارة ملفات المقاييس هي صلاحية حصرية للمسؤول البيداغوجي.',
                            confirmButtonColor: '#1E68E8',
                            allowOutsideClick: false
                        }).then(() => {
                            window.location.href = "inspector_dashboard.html"; 
                        });
                        return; 
                    }
                } catch (e) {
                    console.error("خطأ في فحص الصلاحيات:", e);
                }
            }

            renderCenters(); 
        } else {
            Swal.fire('خطأ', 'لم يتم العثور على إعدادات الموقع المركزية.', 'error');
        }
    });
}

// ==================== 3. الرسم الديناميكي للواجهة ====================

function renderCenters() {
    const container = document.getElementById("centers-container");
    container.innerHTML = "";
    
    const centers = SITE_SETTINGS.UI_NAMES.centers || {};
    let hasCenters = false;

    for (let cId in centers) {
        hasCenters = true;
        const cName = centers[cId];
        container.innerHTML += `
            <div class="service" onclick="openCenter('${cId}')">
                <div class="service-icon-wrapper"><i class="fa-solid fa-school"></i></div>
                <h3>مركز التكوين<br>${cName}</h3>
            </div>
        `;
    }

    if (!hasCenters) {
        container.innerHTML = '<div style="grid-column: 1/-1; color: #dc2626; font-weight: bold; font-size: 18px;">لا توجد مراكز تكوين مبرمجة حالياً.</div>';
    }
}

function openCenter(centerId) {
  const selectedCenterName = SITE_SETTINGS.UI_NAMES.centers[centerId];
  
  if (userEmpId !== "ADMIN_ACCESS" && selectedCenterName !== inspectorCenter) {
     Swal.fire({
          icon: 'warning',
          title: '<h3 style="color:#d32f2f; margin:0; font-weight:700; font-family:\'Cairo\';"><i class="fa-solid fa-shield-halved"></i> صلاحيات مقيدة</h3>',
          html: `
              <div style="font-size: 15px; line-height: 1.8; color: #444; padding: 5px 0; font-family:\'Cairo\';">
                  عذراً أستاذي الكريم، النظام يمنع وصولك إلى ملفات هذا المركز لعدم امتلاكك الصلاحيات الإدارية اللازمة.
                  
                  <div style="color: #d32f2f; font-size: 16px; font-weight: bold; margin: 15px 0; padding: 10px; background: #ffebee; border-radius: 8px; border: 1px dashed #d32f2f;">
                      <i class="fa-solid fa-ban"></i> ${selectedCenterName}
                  </div>
                  
                  <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                  
                  <div style="font-size: 14px; color: #666; margin-bottom: 10px;">
                      تقتصر صلاحياتك الحالية بصفتك مشرفاً على إدارة ملفات مركزك فقط:
                  </div>
                  
                  <div>
                      <span style="background: #e8fbf0; color: #0FBA50; padding: 8px 15px; border-radius: 8px; font-weight: bold; border: 1px solid #0FBA50; display: inline-block;">
                          <i class="fa-solid fa-check-circle"></i> ${inspectorCenter}
                      </span>
                  </div>
              </div>
          `,
          confirmButtonText: '<i class="fa-solid fa-check"></i> حسناً، فهمت',
          confirmButtonColor: '#102a43'
      });
      return;
  }

  const centerLinks = SITE_SETTINGS.dbLinks[centerId] || {};
  const availableLevels = Object.keys(centerLinks);

  if (availableLevels.length === 0) {
      Swal.fire('تنبيه', 'لا توجد أطوار مبرمجة في هذا المركز حالياً. يرجى إضافتها من إعدادات المديرية.', 'info');
      return;
  }

  if (availableLevels.length === 1) {
      showSpecsModal(centerId, availableLevels[0], false);
  } else {
      showLevelsModal(centerId, availableLevels);
  }
}

function showLevelsModal(centerId, availableLevels) {
    let html = '<div class="icon-container">';
    
    availableLevels.forEach(lvlId => {
        let defaultIcon = 'fa-layer-group';
        let defaultName = lvlId;
        
        if (ICONS.levels[lvlId]) {
            defaultIcon = ICONS.levels[lvlId].icon;
            defaultName = ICONS.levels[lvlId].name;
        }
        
        let levelName = (SITE_SETTINGS.UI_NAMES && SITE_SETTINGS.UI_NAMES.levels && SITE_SETTINGS.UI_NAMES.levels[lvlId]) 
                        ? SITE_SETTINGS.UI_NAMES.levels[lvlId] 
                        : defaultName;

        html += `
          <div class="icon-btn" onclick="showSpecsModal('${centerId}', '${lvlId}', true)">
            <i class="fa-solid ${defaultIcon}"></i>
            <span>${levelName}</span>
          </div>`;
    });
    
    html += '</div>';

    Swal.fire({
        title: 'اختر الطور المستهدف:',
        html: html,
        showConfirmButton: true,
        confirmButtonText: 'إغلاق',
        confirmButtonColor: '#939393',
        scrollbarPadding: false
    });
}

function showSpecsModal(centerId, lvlId, showBackButton) {
    const specsData = SITE_SETTINGS.dbLinks[centerId][lvlId] || {};
    const availableSpecs = Object.keys(specsData);

    if (availableSpecs.length === 0) {
        Swal.fire('تنبيه', 'لا توجد تخصصات مبرمجة لهذا الطور.', 'info');
        return;
    }

    const levelName = SITE_SETTINGS.UI_NAMES.levels[lvlId] || (ICONS.levels[lvlId] ? ICONS.levels[lvlId].name : lvlId);

    let html = '<div class="icon-container">';
    
    availableSpecs.forEach(spcId => {
        let spcInfo = ICONS.specs[spcId] || { name: spcId, icon: 'fa-book' };
        html += `
          <div class="icon-btn" onclick="openLink('${centerId}', '${lvlId}', '${spcId}')">
            <i class="fa-solid ${spcInfo.icon}"></i>
            <span>${spcInfo.name}</span>
          </div>`;
    });
    
    html += '</div>';

    let options = {
        title: `<div style="color: #1E68E8; font-size: 20px; font-weight: bold; border-bottom: 2px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 10px;">
                    <i class="fa-solid fa-layer-group"></i> ${levelName}
                </div>
                <div style="color: #475569; font-size: 16px;">يرجى اختيار التخصص المناسب:</div>`,
        html: html,
        showConfirmButton: true,
        confirmButtonText: 'إغلاق',
        confirmButtonColor: '#939393',
        scrollbarPadding: false
    };

    if (showBackButton) {
        options.showDenyButton = true;
        options.denyButtonText = '<i class="fa-solid fa-arrow-right"></i> تراجع للوراء';
        options.denyButtonColor = '#1E68E8';
    }

    Swal.fire(options).then((result) => {
        if (result.isDenied && showBackButton) {
            const availableLevels = Object.keys(SITE_SETTINGS.dbLinks[centerId]);
            showLevelsModal(centerId, availableLevels);
        }
    });
}

function openLink(centerId, levelId, specId) {
    window.location.href = `manage_courses.html?c=${centerId}&l=${levelId}&s=${specId}`;
}

// ==================== 4. تأثير الكتابة السلسة ====================
const textToType = "الجمهورية الجزائرية الديمقراطية الشعبية | وزارة التربية الوطنية | مديرية التربية لولاية توقرت";
const typeWriterElement = document.getElementById('typewriter-text');
let charIndex = 0;

function typeWriter() {
    if (charIndex < textToType.length) {
        typeWriterElement.innerHTML += textToType.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 45); 
    } else {
        setTimeout(startFadeOut, 3000); 
    }
}

function startFadeOut() {
    typeWriterElement.classList.add('fade-out');
    setTimeout(() => {
        typeWriterElement.innerHTML = "";
        charIndex = 0;
        typeWriterElement.classList.remove('fade-out'); 
        setTimeout(typeWriter, 500); 
    }, 1000);
}

window.onload = async function() { 
    typeWriter(); 
    
    // التحقق من الجلسة وسيرفرات فايربيز
    const userEmpId = sessionStorage.getItem("userEmpId");
    if (!userEmpId) { 
        window.location.href = "admin095526.html"; 
        return; 
    }

    firebase.auth().onAuthStateChanged(async (user) => {
        if (user) {
            const hasPermission = await checkUserPermissions();
            if (hasPermission) {
                initSiteSettings();
            }
        } else {
            window.location.href = "admin095526.html";
        }
    });
};

</script>

</body>
</html>
