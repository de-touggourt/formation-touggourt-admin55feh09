<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فضاء التكوين البيداغوجي توقرت - إدارة الملفات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  
<style>
/* ============================================================
   1. الإعدادات الأساسية والخلفية العصرية
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

body::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #f4f7f6;
  background-image: radial-gradient(#1E68E8 0.5px, transparent 0.5px), radial-gradient(#1E68E8 0.5px, #f4f7f6 0.5px);
  background-size: 20px 20px; background-position: 0 0, 10px 10px; opacity: 0.1;
  z-index: -1;
}

body { 
    font-family:'Cairo',sans-serif; margin:0; text-align:center; 
    min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; 
}

/* شريط التمرير */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #e2e8f0; }
::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }
body.swal2-shown { overflow-y: auto !important; padding-right: 0 !important; }

/* شريط الأخبار العلوي */
.news-ticker-container { 
    background-color: #0d47a1; color: #fff; width: 100%; min-height: 40px; 
    display: flex; align-items: center; justify-content: center; position: relative; 
    z-index: 20; padding: 5px 15px; font-size: 14px; font-weight: 600; 
}
.typewriter-text { display: inline-block; transition: opacity 0.5s; }
.typewriter-text.fade-out { opacity: 0; }

/* الهيدر العصري بتدرج أزرق فاخر */
header { 
    background: linear-gradient(135deg, #1E68E8 0%, #0d47a1 100%);
    position: relative; padding: 40px 20px 70px 20px; 
    border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; 
    box-shadow: 0 10px 30px rgba(30, 104, 232, 0.2); 
    z-index: 10; display: flex; flex-direction: column; align-items: center; 
}

header h1 { margin: 15px 0 5px 0; font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
header p { margin: 0; font-size: 15px; color: #bbdefb; font-weight: 600; }

/* زر الرجوع للوحة التحكم */
.btn-back { 
    position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.2); 
    backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); 
    padding: 8px 16px; border-radius: 25px; cursor: pointer; font-weight: 700; font-family: 'Cairo'; 
    z-index: 30; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    transition: 0.3s; font-size: 13px; 
}
.btn-back:hover { background: #fff; color: #1E68E8; transform: translateY(-2px); }

/* خدمات المراكز (شبكة البطاقات المتداخلة Overlapping) */
.services { 
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
    gap: 25px; padding: 0 20px 40px 20px; max-width: 1100px; width: 100%; 
    margin: -35px auto 0; /* التداخل لرفع البطاقات فوق الهيدر */
    z-index: 20; position: relative; flex: 1; 
}

.service { 
    background: #fff; border-radius: 20px; padding: 25px 20px; cursor: pointer; 
    box-shadow: 0 10px 20px rgba(0,0,0,0.06); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    display: flex; flex-direction: column; align-items: center; text-align: center; 
    border: 1px solid #e2e8f0; position: relative; overflow: hidden; 
}
.service::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    background: linear-gradient(90deg, #1E68E8, #3b82f6); transform: scaleX(0); transition: 0.4s ease; transform-origin: right;
}
.service:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(30, 104, 232, 0.15); border-color: #93c5fd; }
.service:hover::before { transform: scaleX(1); }
.service:active { transform: translateY(-3px) scale(0.98); }

.service-icon-wrapper {
    width: 70px; height: 70px; border-radius: 18px; background: #f0f7ff;
    display: flex; justify-content: center; align-items: center; margin-bottom: 15px;
    transition: 0.4s ease; border: 2px solid transparent;
}
.service:hover .service-icon-wrapper { background: #1E68E8; transform: rotate(10deg); border-color: #fff; box-shadow: 0 8px 15px rgba(30, 104, 232, 0.3); }

.service i { font-size: 32px; color: #1E68E8; transition: 0.4s ease; }
.service:hover i { color: #fff; }

.service h3 { color: #1e293b; font-size: 18px; font-weight: 800; margin: 0; line-height: 1.5; }

/* الأيقونات المنبثقة داخل النوافذ (مودال) */
.icon-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 10px; }
.icon-btn { 
    width: 140px; height: 130px; border-radius: 16px; border: 2px solid #e2e8f0; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    font-weight: 800; background: #fff; color: #1e293b; cursor: pointer; transition: .3s; 
    text-align: center; padding: 10px; font-size: 15px; 
}
.icon-btn i { font-size: 32px; margin-bottom: 12px; color: #1E68E8; transition: 0.3s; }
.icon-btn:hover { border-color: #1E68E8; box-shadow: 0 8px 20px rgba(30, 104, 232, 0.15); transform: translateY(-5px); color: #1E68E8; }
.icon-btn:hover i { transform: scale(1.1); }
.icon-btn:active { transform: scale(0.95); }

/* تنسيقات SweetAlert العصرية */
.swal2-popup { border-radius: 24px !important; padding: 0 !important; overflow: hidden; background: #fff !important; z-index: 999999 !important;}
.swal2-title { background: #f8fafc; padding: 20px !important; margin: 0 !important; font-size: 20px !important; border-bottom: 1px solid #e2e8f0; color: #0f172a !important; }
.swal2-html-container { padding: 20px !important; margin: 0 !important; }
.swal2-actions { background: #f8fafc; padding: 15px !important; margin: 0 !important; border-top: 1px solid #e2e8f0; }

.swal2-confirm { background:#102a43 !important; color:#fff !important; border-radius:12px !important; padding:10px 25px !important; font-family:'Cairo',sans-serif; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.15); margin: 5px !important; border:none !important; }
.swal2-confirm:hover { background: #243b53 !important; }
.swal2-deny { background: #1E68E8 !important; color: #fff !important; border-radius: 12px !important; padding: 10px 25px !important; font-family: 'Cairo', sans-serif; margin: 5px !important; border:none !important; }
.swal2-deny:hover { background: #1557c0 !important; }

footer { background: transparent; color: #64748b; padding: 20px; font-weight: 600; font-size: 13px; margin-top: auto; text-align: center; }

/* شاشة التحميل الدائرية */
.loader-spinner { border: 4px solid #e2e8f0; border-top: 4px solid #1E68E8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* ============================================================
   📱 تحسينات التجاوب (Media Queries)
   ============================================================ */
@media (max-width: 768px) {
    header { padding: 30px 15px 50px 15px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
    header h1 { font-size: 22px; }
    .btn-back { top: 15px; right: 15px; padding: 6px 12px; font-size: 12px; }
    .services { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: -25px; padding: 0 15px 30px 15px; }
    .service { padding: 20px 15px; }
    .service-icon-wrapper { width: 55px; height: 55px; margin-bottom: 10px; }
    .service i { font-size: 26px; }
    .service h3 { font-size: 15px; }
    .icon-btn { width: 45%; height: 110px; font-size: 14px; }
    .icon-btn i { font-size: 26px; }
}

@media (max-width: 400px) {
    .services { grid-template-columns: 1fr; }
    .icon-btn { width: 100%; height: 80px; flex-direction: row; gap: 15px; justify-content: flex-start; padding: 0 20px; }
    .icon-btn i { margin-bottom: 0; }
}
</style>
</head>

<body>

<div class="news-ticker-container">
    <span id="typewriter-text" class="typewriter-text"></span>
</div>

<header>
  <!-- زر العودة للوحة التحكم -->
  <button class="btn-back" onclick="goBack()"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة</button>

  <h1>إدارة الملفات والمقاييس</h1>
  <p>الرجاء اختيار المركز لإدارة ملفاته ومقاييسه</p>
</header>

<!-- قسم عرض المراكز ديناميكياً -->
<section id="centers-container" class="services">
    <div style="grid-column: 1/-1; padding: 50px;">
        <div class="loader-spinner"></div>
        <p style="color:#1E68E8; font-weight:bold; margin-top:15px;">جاري جلب المراكز المعتمدة...</p>
    </div>
</section>

<footer>© 2026 مديرية التربية لولاية توقرت | فضاء التكوين البيداغوجي | جميع الحقوق محفوظة</footer>


  <script src="js/sys-shield-v2.js" defer></script>
  <script src="js/storage-router-8a2d.js" defer></script>


</body>
</html>
