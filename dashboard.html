<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فضاء التكوين البيداغوجي - توقرت</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
/* =========================================
   1. الإعدادات الأساسية والخلفية
   ========================================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

body::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #f4f7f6; /* خلفية رمادية فاتحة جداً مريحة للعين */
  background-image: radial-gradient(#0FBA50 0.5px, transparent 0.5px), radial-gradient(#0FBA50 0.5px, #f4f7f6 0.5px);
  background-size: 20px 20px; background-position: 0 0, 10px 10px; opacity: 0.1;
  z-index: -1;
}

body {
  font-family: 'Cairo', sans-serif;
  display: flex; flex-direction: column; overflow-x: hidden;
}

/* شريط التمرير */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #e2e8f0; }
::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }
body.swal2-shown { overflow-y: auto !important; padding-right: 0 !important; }

/* =========================================
   2. شريط الأخبار العلوي
   ========================================= */
.news-ticker-container {
    background: #085d28; color: #fff; width: 100%; min-height: 40px;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 20; padding: 5px 15px; font-size: 14px; font-weight: 600;
}
.typewriter-text { display: inline-block; transition: opacity 0.5s; }
.typewriter-text.fade-out { opacity: 0; }

/* =========================================
   3. قسم الهيدر (Hero Section) - البطاقة المدمجة
   ========================================= */
.hero-section {
    background: linear-gradient(135deg, #0FBA50 0%, #085d28 100%);
    position: relative; padding: 40px 20px 80px 20px;
    border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
    box-shadow: 0 10px 30px rgba(15, 186, 80, 0.2);
    z-index: 10; display: flex; flex-direction: column; align-items: center;
}

.identity-card {
    background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    width: 100%; max-width: 1000px; padding: 25px; gap: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

.user-profile {
    display: flex; align-items: center; gap: 20px; flex: 1; min-width: 300px;
}
.avatar-box {
    width: 80px; height: 80px; border-radius: 50%; background: #fff;
    border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; justify-content: center; align-items: center; flex-shrink: 0;
}
.avatar-box img { width: 100%; height: 100%; object-fit: cover; }
.avatar-box i { font-size: 35px; color: #94a3b8; }

.user-info { color: #fff; text-align: right; }
.user-info h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
.user-info p { margin: 3px 0; font-size: 14px; font-weight: 600; opacity: 0.9; display: flex; align-items: center; gap: 8px; }
.user-info p i { width: 16px; text-align: center; color: #a7f3d0; }

.divider { width: 2px; height: 70px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

.center-info { flex: 1; min-width: 300px; text-align: left; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: flex-end;}
.center-info h1 { margin: 0 0 10px 0; font-size: 24px; font-weight: 800; line-height: 1.4; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
.badge-subtitle {
    background: rgba(255,255,255,0.2); padding: 6px 15px; border-radius: 20px;
    font-size: 14px; font-weight: 700; border: 1px solid rgba(255,255,255,0.3); display: inline-block;
}

/* =========================================
   4. شبكة المراكز (التداخل Overlapping)
   ========================================= */
.services {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px; padding: 0 20px 40px 20px; max-width: 1100px; width: 100%; 
    margin: -40px auto 0; /* التداخل لرفعها فوق الهيدر الأخضر */
    z-index: 20; position: relative; flex: 1;
}

.service {
    background: #fff; border-radius: 20px; padding: 25px 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.06); cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex; flex-direction: column; align-items: center; text-align: center;
    border: 1px solid #e2e8f0; position: relative; overflow: hidden;
}
.service::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
    background: linear-gradient(90deg, #0FBA50, #22c55e); transform: scaleX(0); transition: 0.4s ease; transform-origin: right;
}
.service:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(15, 186, 80, 0.15); border-color: #a7f3d0; }
.service:hover::before { transform: scaleX(1); }
.service:active { transform: translateY(-3px) scale(0.98); }

.icon-wrapper {
    width: 70px; height: 70px; border-radius: 18px; background: #f0fdf4;
    display: flex; justify-content: center; align-items: center; margin-bottom: 15px;
    transition: 0.4s ease; border: 2px solid transparent;
}
.service:hover .icon-wrapper { background: #0FBA50; transform: rotate(10deg); border-color: #fff; box-shadow: 0 8px 15px rgba(15, 186, 80, 0.3); }

.service i { font-size: 32px; color: #0FBA50; transition: 0.4s ease; }
.service:hover i { color: #fff; }

.service h3 { color: #1e293b; font-size: 18px; font-weight: 800; margin: 0; line-height: 1.5; }

/* =========================================
   5. النوافذ المنبثقة (SweetAlert)
   ========================================= */
.swal2-popup { border-radius: 24px !important; padding: 0 !important; overflow: hidden; background: #fff !important; }
.swal2-title { background: #f8fafc; padding: 20px !important; margin: 0 !important; font-size: 20px !important; border-bottom: 1px solid #e2e8f0; color: #0f172a !important; }
.swal2-html-container { padding: 20px !important; margin: 0 !important; }
.swal2-actions { background: #f8fafc; padding: 15px !important; margin: 0 !important; border-top: 1px solid #e2e8f0; }

.icon-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
.icon-btn {
    width: 140px; height: 130px; border-radius: 16px; border: 2px solid #e2e8f0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fff; cursor: pointer; transition: 0.3s; font-weight: 800; font-size: 15px; color: #1e293b;
    text-align: center; padding: 10px;
}
.icon-btn i { font-size: 32px; margin-bottom: 12px; color: #0FBA50; transition: 0.3s; }
.icon-btn:hover { border-color: #0FBA50; box-shadow: 0 8px 20px rgba(15, 186, 80, 0.15); transform: translateY(-5px); color: #0FBA50; }
.icon-btn:hover i { transform: scale(1.1); }
.icon-btn:active { transform: scale(0.95); }

.swal2-confirm { background: #64748b !important; color: #fff !important; border-radius: 12px !important; padding: 10px 25px !important; font-family: 'Cairo' !important; font-weight: 700 !important; }
.swal2-deny { background: #0FBA50 !important; color: #fff !important; border-radius: 12px !important; padding: 10px 25px !important; font-family: 'Cairo' !important; font-weight: 700 !important; }

/* شاشة التحميل */
#loader { display: flex; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); z-index:99999; justify-content:center; align-items:center; flex-direction:column; }
.spinner { border: 4px solid #e2e8f0; border-top: 4px solid #0FBA50; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

footer { background: transparent; color: #64748b; padding: 20px; font-weight: 600; font-size: 13px; margin-top: auto; text-align: center; }

/* =========================================
   6. التجاوب مع الشاشات (Responsive)
   ========================================= */
@media (max-width: 768px) {
    .hero-section { padding: 30px 15px 60px 15px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
    .identity-card { flex-direction: column; text-align: center; padding: 20px; gap: 15px; }
    .user-profile { flex-direction: column; gap: 10px; width: 100%; text-align: center; }
    .user-info { text-align: center; }
    .user-info p { justify-content: center; }
    .divider { width: 100%; height: 1px; background: rgba(255, 255, 255, 0.1); margin: 5px 0; }
    .center-info { align-items: center; text-align: center; width: 100%; }
    
    .services { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: -30px; padding: 0 15px 30px 15px; }
    .service { padding: 20px 15px; }
    .icon-wrapper { width: 55px; height: 55px; margin-bottom: 10px; }
    .service i { font-size: 26px; }
    .service h3 { font-size: 14px; }
    
    .icon-btn { width: 45%; height: 110px; font-size: 13px; }
    .icon-btn i { font-size: 26px; }
}

@media (max-width: 400px) {
    .services { grid-template-columns: 1fr; }
    .icon-btn { width: 100%; height: 80px; flex-direction: row; gap: 15px; justify-content: flex-start; padding: 0 20px;}
    .icon-btn i { margin-bottom: 0; }
}
</style>
</head>

<body>

<!-- شاشة التحميل الأولية -->
<div id="loader">
  <div class="spinner"></div>
  <h3 style="color: #0FBA50; margin-top: 15px; font-family: 'Cairo'; font-weight:800;">جاري التحقق من هويتك وتأمين الدخول...</h3>
</div>

<div class="news-ticker-container">
    <span id="typewriter-text" class="typewriter-text"></span>
</div>

<!-- الهيدر الحديث (البطاقة المدمجة) -->
<header class="hero-section">
<button onclick="logout()" style="position: absolute; top: 20px; left: 20px; background: rgba(239, 68, 68, 0.2); backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: 700; font-family: 'Cairo'; z-index: 30; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; font-size: 13px;" onmouseover="this.style.background='#dc2626'; this.style.transform='translateY(-2px)';" onmouseout="this.style.background='rgba(239, 68, 68, 0.2)'; this.style.transform='translateY(0)';">
        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
    </button>
    <div class="identity-card">
        <!-- معلومات المستخدم -->
        <div class="user-profile">
            <div class="avatar-box" id="userAvatarContainer">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-info">
                <h2 id="userNameDisplay">جاري التحميل...</h2>
                <p><i class="fa-solid fa-briefcase"></i> <span id="userRankDisplay">-</span></p>
                <!-- 🌟 إضافة حقل التخصص هنا 🌟 -->
                <p><i class="fa-solid fa-book-open"></i> <span id="userSpecDisplay">-</span></p>
                <p><i class="fa-solid fa-school"></i> <span id="userWorkplaceDisplay">-</span></p>
            </div>
        </div>

        <div class="divider"></div>

        <!-- معلومات النظام -->
        <div class="center-info">
            <h1>فضاء التكوين البيداغوجي</h1>
            <div class="badge-subtitle">مديرية التربية لولاية توقرت</div>
        </div>
    </div>
</header>

<!-- قسم عرض المراكز ديناميكياً -->
<section class="services" id="centers-container">
    <div style="grid-column: 1/-1; padding: 50px;">
        <div class="spinner" style="margin: auto;"></div>
        <p style="color:#0FBA50; font-weight:bold; margin-top:15px; font-family:'Cairo';">جاري جلب المراكز المعتمدة...</p>
    </div>
</section>

<footer>جميع الحقوق محفوظة لمديرية التربية لولاية توقرت © 2026</footer>


  <script src="js/sys-shield-v2.js" defer></script>
  <script src="js/portal-view-6d9b.js" defer></script>


</body>
</html>
