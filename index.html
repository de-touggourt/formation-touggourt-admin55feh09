<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>فضاء التكوين البيداغوجي توقرت - تسجيل الدخول</title>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ===========================
       1. إعدادات أساسية والتجاوب
       =========================== */
    * { 
        box-sizing: border-box; 
        -webkit-tap-highlight-color: transparent; 
    }

    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      /* صورة الخلفية المشتركة */
      background-image: url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      position: relative;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 15px; 
    }

    /* طبقة شفافة زجاجية تدمج اللون الأخضر الهادئ مع التدرجات */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(8, 93, 40, 0.40), rgba(15, 186, 80, 0.50));
      backdrop-filter: blur(0px);
      z-index: -1;
    }

    /* ===========================
       2. الحاوية الرئيسية (تأثير الضوء الأخضر المتحرك)
       =========================== */
    .container {
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2), 0 0 20px rgba(15, 186, 80, 0.15);
      text-align: center;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      position: relative;
      overflow: hidden; 
      z-index: 1; 
      transform: translateZ(0); 
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* الضوء الدوار خلف الحاوية (معدل للون الأخضر وحركة بطيئة) */
    .container::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent 65%, rgba(15, 186, 80, 0.5) 85%, #00ff6a 100%);
      animation: spinBorderLight 15s linear infinite;
      z-index: -2;
    }

    /* الخلفية البيضاء الزجاجية الأساسية التي تغطي الدوران وتترك الإطار */
    .container::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px; right: 3px; bottom: 3px; 
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 25px; 
      z-index: -1;
    }

    @keyframes spinBorderLight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===========================
       3. النصوص والعناوين
       =========================== */
    .header-text {
        margin-bottom: 20px;
        border-bottom: 2px dashed #e2e8f0;
        padding-bottom: 12px;
    }

    .header-text p {
        margin: 4px 0;
        font-size: 14px;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: 0.3px;
    }

    .login-title {
        color: #085d28;
        margin-bottom: 20px;
        font-size: 19px;
        font-weight: 800;
        margin-top: 15px;
        line-height: 1.4;
    }

    /* ===========================
       4. الشعار (حركة التحليق/الطفو)
       =========================== */
    .login-logo-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 5px auto 15px auto;
        display: flex;
        justify-content: center;
        align-items: center;
        
    }

    .login-logo {
        width: 115px;
        height: 115px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
        position: relative;
        z-index: 2;
        /* حركة التحليق الناعمة */
        animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
        0%, 100% { transform: translateY(0px); box-shadow: 0 8px 20px rgba(15, 186, 80, 0.2); }
        50% { transform: translateY(-8px); box-shadow: 0 18px 30px rgba(15, 186, 80, 0.35); }
    }

    /* الدائرة المتقطعة المتلاصقة */
    .login-logo-ring {
        position: absolute;
        width: 119px; 
        height: 119px;
        border: 1.5px dashed #0FBA50; 
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: rotateRing 15s linear infinite;
        z-index: 1;
    }

    @keyframes rotateRing {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ===========================
       5. حقول الإدخال والأزرار العصرية
       =========================== */
    .input-group {
        position: relative;
        margin-bottom: 15px;
    }

    .input-group i {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-size: 18px;
        transition: 0.3s;
    }

    input {
        width: 100%;
        padding: 14px 45px 14px 16px;
        border-radius: 14px;
        border: 2px solid #cbd5e1;
        font-size: 16px;
        text-align: right;
        font-family: 'Cairo', sans-serif;
        font-weight: 700;
        transition: 0.3s;
        background: #f8fafc;
        color: #0f172a;
    }

    input:focus {
        outline: none;
        border-color: #0FBA50;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(15, 186, 80, 0.12);
    }

    input:focus + i, input:valid + i {
        color: #0FBA50;
    }

    button {
        background: linear-gradient(135deg, #0FBA50, #085d28);
        color: white;
        border: none;
        padding: 14px 0;
        border-radius: 14px;
        font-size: 16px;
        cursor: pointer;
        font-weight: 800;
        width: 100%;
        font-family: 'Cairo', sans-serif;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 6px 15px rgba(15, 186, 80, 0.25);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(15, 186, 80, 0.35);
    }

    button:active {
        transform: translateY(0);
    }

    .barcode-btn {
        background: #fff;
        color: #085d28;
        border: 2px solid #0FBA50;
        box-shadow: none;
    }

    .barcode-btn:hover {
        background: #f0fdf4;
        color: #085d28;
        box-shadow: 0 6px 15px rgba(15, 186, 80, 0.1);
    }

    /* منطقة الكاميرا والماسح */
    #reader {
        width: 100% !important;
        max-width: 320px;
        margin: 15px auto;
        display: none;
        border-radius: 14px;
        overflow: hidden;
        border: 2px solid #0FBA50;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    /* ===========================
       6. شاشة التحميل (Loader) والرسائل
       =========================== */
    #imageLoaderOverlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.6); display: none;
        justify-content: center; align-items: center; z-index: 99999;
        backdrop-filter: blur(4px);
    }

    #loaderBox {
        background: #ffffff; padding: 25px 35px; border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center;
        width: 85%; max-width: 280px;
    }

    .loader-circle {
        border: 4px solid #f1f5f9; border-top: 4px solid #0FBA50;
        border-radius: 50%; width: 50px; height: 50px; margin: auto;
        animation: spinLoader 0.8s linear infinite;
    }

    @keyframes spinLoader {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loader-text {
        margin-top: 15px; font-size: 15px; font-weight: 800;
        color: #085d28; font-family: 'Cairo', sans-serif;
    }

    .swal2-popup {
        border-radius: 24px !important;
        font-family: 'Cairo', sans-serif !important;
        padding: 20px !important;
    }
    
    .swal2-confirm {
        background: #0FBA50 !important;
        box-shadow: 0 6px 15px rgba(15, 186, 80, 0.3) !important;
        border-radius: 12px !important;
        font-weight: 700 !important;
    }

    /* ===========================
       7. استعلامات الوسائط (الشاشات الصغيرة)
       =========================== */
    @media (max-width: 380px) {
        .container { padding: 25px 18px; border-radius: 20px; }
        .container::after { border-radius: 17px; } /* تعديل الداخلي للموبايل ليلائم الإطار */
        .header-text p { font-size: 13px; }
        .login-logo-wrapper { width: 100px; height: 100px; margin-bottom: 10px; }
        .login-logo { width: 95px; height: 95px; }
        .login-logo-ring { width: 99px; height: 99px; border-width: 1.5px; } 
        .login-title { font-size: 17px; }
        button, input { font-size: 14px; padding: 12px; }
    }
  </style>
</head>

<body>
  <div class="container" id="mainContainer">
    
      <div class="header-text">
        <p>الجمهورية الجزائرية الديمقراطية الشعبية</p>
        <p>وزارة التربية الوطنية</p>
        <p>مديرية التربية لولاية توقرت</p>
      </div>
      
      <div class="login-logo-wrapper" onclick="handleLogoClick()">
          <div class="login-logo-ring"></div>
          <img src="https://lh3.googleusercontent.com/d/1BqWoqh1T1lArUcwAGNF7cGnnN83niKVl" alt="شعار اللجنة" class="login-logo" style="user-select: none; -webkit-user-select: none;">
      </div>

      <h2 class="login-title">الفضاء الرقمي للتكوين البيداغوجي توقرت</h2>
      
      <div class="input-group">
          <input type="text" id="empId" placeholder="أدخل رقم التعريف الوظيفي" oninput="validateNumber(this)" required>
          <i class="fa-solid fa-id-card"></i>
      </div>
      
      <button onclick="checkEmployee()">
          <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
      </button>

      <button type="button" class="barcode-btn" onclick="startBarcodeScanner()">
        <i class="fa-solid fa-camera"></i> مسح الباركود
      </button>

      <div id="reader"></div>

      <input type="file" id="barcodeImage" accept="image/*" style="display:none; margin-top:8px;">
      
  </div>

<div id="imageLoaderOverlay">
    <div id="loaderBox">
        <div class="loader-circle"></div>
        <div class="loader-text">جاري تحليل الصورة…</div>
    </div>
</div>

<script>
// ================= إعدادات Firebase =================
const firebaseConfig = {
  apiKey: "AIzaSyBNBrVpBK8p_WWNwNhSH-mZ6NXOyr2TLhI",
  authDomain: "voyage-touggourt-48755.firebaseapp.com",
  projectId: "voyage-touggourt-48755",
  storageBucket: "voyage-touggourt-48755.firebasestorage.app",
  messagingSenderId: "712694455348",
  appId: "1:712694455348:web:5b4e8df57347edf944fe61",
  measurementId: "G-TTJT4LQ65L"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DASHBOARD_PAGE = "dashboard.html"; 

const REGEX_PATTERNS = {
  nonDigit: /\D/g
};

function validateNumber(input) {
  input.value = input.value.replace(REGEX_PATTERNS.nonDigit, '');
  if (input.value.length > 16) input.value = input.value.slice(0, 16);
}

async function checkEmployee() {
  const empId = document.getElementById("empId").value.trim();

  if (empId.length < 16) {
    Swal.fire({ 
      icon: 'warning', 
      title: 'تنبيه', 
      text: 'رقم التعريف الوظيفي يجب أن يتكون من 16 رقمًا',
      confirmButtonText: 'حسناً'
    });
    return;
  }

  Swal.fire({ title: 'جاري التحقق...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  try {
    const docRef = db.collection("employeescomnew").doc(empId);
    const docSnap = await docRef.get();

    if (!docSnap.exists) {
      Swal.close();
      Swal.fire({
        icon: "error",
        title: "❌ خطأ",
        html: `
         رقم الموظف غير موجود ضمن قاعدة بيانات الأساتذة المتربصين<br>
يرجى مراجعة الرقم المدخل أو التواصل مع مصالح المديرية.<br><br>
        `,
        confirmButtonText: "حسناً"
      });
      return;
    }

    const data = docSnap.data();
    
    sessionStorage.setItem("userEmpId", empId);
    sessionStorage.setItem("userName", data.name || "الموظف");
    sessionStorage.setItem("isLoggedIn", "true");

    Swal.close();
    
    Swal.fire({
      icon: 'success',
      title: 'تم التحقق بنجاح',
      html: `مرحباً بك <b>${data.name || ''}</b><br>جاري تسجيل الدخول ...`,
      timer: 1500,
      timerProgressBar: true,
      showConfirmButton: false,
      willClose: () => {
        window.location.href = DASHBOARD_PAGE;
      }
    });

  } catch (err) {
    Swal.close();
    Swal.fire({
      icon: "error",
      title: "❌ خطأ",
      text: "حدث خطأ أثناء الاتصال بقاعدة البيانات",
      confirmButtonText: "حسناً"
    });
    console.error("Firebase error:", err);
  }
}

// ================= كود ماسح الباركود (كاميرا + صورة) =================
let scanner = null;

function startBarcodeScanner() {
    const readerDiv = document.getElementById("reader");
    const imageInput = document.getElementById("barcodeImage");

    imageInput.style.display = "block";
    readerDiv.innerHTML = "";
    readerDiv.style.display = "block";

    if (scanner) return;

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: { exact: "environment" } },
        { fps: 12, qrbox: 250 },
        decodedText => {
            if (navigator.vibrate) navigator.vibrate(200);

            document.getElementById("empId").value = decodedText;

            scanner.stop().then(() => {
                scanner = null;
                readerDiv.style.display = "none";
                imageInput.style.display = "none";
            });

            checkEmployee();
        }
    ).catch(() => {
        Html5Qrcode.getCameras().then(cameras => {
            if (!cameras.length) {
                Swal.fire("خطأ", "لا توجد كاميرات متاحة", "error");
                return;
            }

            const backCam = cameras.find(c =>
                c.label.toLowerCase().includes("back") ||
                c.label.toLowerCase().includes("rear")
            );

            const camToUse = backCam ? backCam.id : cameras[0].id;

            scanner.start(
                camToUse,
                { fps: 12, qrbox: 250 },
                decodedText => {
                    if (navigator.vibrate) navigator.vibrate(200);

                    document.getElementById("empId").value = decodedText;

                    scanner.stop().then(() => {
                        scanner = null;
                        readerDiv.style.display = "none";
                        imageInput.style.display = "none";
                    });

                    checkEmployee();
                }
            );
        });
    });

    imageInput.onchange = function (e) {
        let file = e.target.files[0];
        if (!file) return;

        document.getElementById("imageLoaderOverlay").style.display = "flex";
        readerDiv.innerHTML = "";

        let hiddenDiv = document.createElement("div");
        hiddenDiv.id = "temp-file-scan";
        hiddenDiv.style.display = "none";
        document.body.appendChild(hiddenDiv);

        const fileScanner = new Html5Qrcode("temp-file-scan");

        fileScanner.scanFile(file, true)
            .then(decodedText => {
                document.getElementById("imageLoaderOverlay").style.display = "none";

                if (navigator.vibrate) navigator.vibrate(200);
                document.getElementById("empId").value = decodedText;
                
                try { 
                    if (hiddenDiv.parentNode) hiddenDiv.parentNode.removeChild(hiddenDiv); 
                } catch(err) { console.log(err); }
                
                if (scanner) { 
                    scanner.stop().then(() => {
                        scanner = null;
                        readerDiv.style.display = "none";
                        imageInput.style.display = "none";
                        imageInput.value = ""; 
                    }).catch(()=>{}); 
                } else {
                    readerDiv.style.display = "none";
                    imageInput.style.display = "none";
                    imageInput.value = "";
                }

                setTimeout(() => {
                    checkEmployee();
                }, 100);

            })
            .catch((err) => {
                document.getElementById("imageLoaderOverlay").style.display = "none";
                try { 
                    if (hiddenDiv.parentNode) hiddenDiv.parentNode.removeChild(hiddenDiv); 
                } catch(err) { console.log(err); }
                
                console.error("Scan Error:", err);
                
                Swal.fire({
                    icon: "warning",
                    title: "تنبيه",
                    text: "لم يتم العثور على باركود واضح في الصورة",
                    confirmButtonText: "حسناً",
                    confirmButtonColor: "#0FBA50"
                }).then(() => {
                    imageInput.value = "";
                });
            });
    };
}

const registrationOpen = true; 

window.onload = function() {
    if (!registrationOpen) {
        document.getElementById("empId").style.display = "none";
        const buttons = document.querySelectorAll("button");
        buttons.forEach(btn => btn.style.display = "none");

        const msg = document.createElement("div");
        msg.innerHTML = `
        <div style="background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 10px; padding: 15px; margin-bottom: 20px; font-size: 18px; font-weight: 600;">
            الموقع مغلق حاليًا<br>
        </div>`;
        document.querySelector(".header-text").appendChild(msg);
    }
};  

// ================= كود الدخول المخفي (10 نقرات على الشعار) =================
let logoClickCount = 0;
let clickTimer;

function handleLogoClick() {
    logoClickCount++;
    
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
        logoClickCount = 0;
    }, 2000);

    if (logoClickCount === 10) {
        logoClickCount = 0; 
        promptSecretAdminPassword();
    }
}

async function promptSecretAdminPassword() {
    const { value: password } = await Swal.fire({
        title: '🔒 ولوج خاص',
        text: 'الرجاء إدخال الرقم السري للوحة التحكم',
        input: 'password',
        inputPlaceholder: 'أدخل الرقم السري هنا...',
        showCancelButton: true,
        confirmButtonText: 'دخول',
        cancelButtonText: 'إلغاء',
        confirmButtonColor: '#0FBA50',
        cancelButtonColor: '#d33',
        inputAttributes: {
            autocapitalize: 'off',
            autocorrect: 'off'
        }
    });

    if (password) {
        Swal.fire({
            title: 'جاري التحقق...',
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        try {
            const docRef = db.collection("config").doc("pass");
            const docSnap = await docRef.get();

            if (docSnap.exists) {
                const data = docSnap.data();
                const correctPassword = data['admin panel'];

                if (password === correctPassword) {
                    Swal.fire({
                        icon: 'success',
                        title: 'تم التحقق بنجاح',
                        text: 'جاري تحويلك إلى لوحة التحكم...',
                        timer: 1500,
                        showConfirmButton: false,
                        willClose: () => {
                            window.location.href = "admin095526.html";
                        }
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: '❌ خطأ',
                        text: 'الرقم السري غير صحيح',
                        confirmButtonText: 'حسناً',
                        confirmButtonColor: '#0FBA50'
                    });
                }
            } else {
                Swal.fire('خطأ', 'لم يتم العثور على إعدادات الحماية في قاعدة البيانات', 'error');
            }
        } catch (error) {
            console.error("Error verifying admin password:", error);
            Swal.fire('خطأ', 'حدث خطأ أثناء الاتصال بقاعدة البيانات', 'error');
        }
    }
}
</script>
</body>
</html>
