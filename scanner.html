<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نظام تسجيل الحضور الرقمي لمراكز التكوين</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- مكتبة ماسح الباركود الموثوقة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <!-- إعدادات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    
    :root {
      --primary: #4facfe;
      --success: #0FBA50;
      --warning: #ff9800;
      --danger: #d90429;
      --dark: #0f2027;
    }

    body { 
      background: linear-gradient(135deg, #0a192f, #112240, #1e3c72); 
      color: white; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between; 
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 15px) env(safe-area-inset-left, 12px);
      overflow-x: hidden;
      user-select: none;
    }
    
    /* الشريط العلوي */
    .top-toolbar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      z-index: 30;
      margin-bottom: 8px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-1px); }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn.active { background: #0FBA50; border-color: #0FBA50; box-shadow: 0 0 12px rgba(15, 186, 80, 0.5); }
    .ctrl-btn.disabled { opacity: 0.4; pointer-events: none; }

    .counter-badge {
      background: linear-gradient(135deg, #0FBA50, #0a8a3a);
      color: white;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(15, 186, 80, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .counter-val {
      font-size: 17px;
      font-weight: 900;
    }

    .btn-exit {
      background: rgba(217, 4, 41, 0.2);
      border: 1px solid rgba(217, 4, 41, 0.4);
      color: #ff6b81;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }
    .btn-exit:hover { background: #d90429; color: white; }

    /* الترويسة */
    .header-info {
      text-align: center;
      margin-bottom: 10px;
      z-index: 10;
    }
    .header-info h1 {
      font-size: 20px;
      color: #4facfe;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header-info p {
      font-size: 12.5px;
      color: #e2e8f0;
      margin-top: 4px;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px 14px;
      border-radius: 16px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* حاوية الكاميرا */
    .scanner-wrapper {
      position: relative;
      width: 90%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 25px rgba(79, 172, 254, 0.3);
      background: #000;
      border: 3px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      margin: auto 0;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 24px;
    }
    
    #reader__dashboard_section_csr, 
    #reader__dashboard_section_swaplink,
    #reader__header_message { 
      display: none !important; 
    }

    /* خط الليزر */
    .laser-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #0FBA50;
      box-shadow: 0 0 16px 4px rgba(15, 186, 80, 0.7);
      animation: scanLaser 2.2s infinite ease-in-out;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes scanLaser {
      0% { top: 12%; opacity: 0.1; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 88%; opacity: 0.1; }
    }

    /* زوايا التحديد */
    .scan-corners {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
    }
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #4facfe;
      border-style: solid;
    }
    .c-tl { top: 22px; left: 22px; border-width: 4px 0 0 4px; border-radius: 10px 0 0 0; }
    .c-tr { top: 22px; right: 22px; border-width: 4px 4px 0 0; border-radius: 0 10px 0 0; }
    .c-bl { bottom: 22px; left: 22px; border-width: 0 0 4px 4px; border-radius: 0 0 0 10px; }
    .c-br { bottom: 22px; right: 22px; border-width: 0 4px 4px 0; border-radius: 0 0 10px 0; }

    /* شريط التوجيه السفلي */
    .status-panel { 
      margin-top: 10px; 
      background: rgba(255, 255, 255, 0.09); 
      padding: 10px 20px; 
      border-radius: 16px; 
      text-align: center; 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      font-size: 13.5px;
      z-index: 10;
      max-width: 420px;
      width: 92%;
    }
    .status-panel i { font-size: 16px; color: #4facfe; }

    /* كرت المسح السريع العائم */
    .quick-scan-card {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      width: 92%;
      max-width: 420px;
      background: rgba(16, 42, 67, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid #0FBA50;
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(15, 186, 80, 0.3);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 100;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .quick-scan-card.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .quick-card-img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid #0FBA50;
      flex-shrink: 0;
      background: #f1f5f9;
    }
    .quick-card-info {
      flex: 1;
      min-width: 0;
    }
    .quick-card-name {
      font-weight: 800;
      font-size: 15.5px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-card-sub {
      font-size: 12.5px;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-card-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
    }
    .badge-present { background: #0FBA50; color: white; }
    .badge-late { background: #ff9800; color: white; }
    .badge-warn { background: #eab308; color: #1e293b; }
    .badge-err { background: #d90429; color: white; }

    /* بطاقة الترحيب للتفصيلي */
    .swal-welcome-card { text-align: right; line-height: 2; font-size: 15px; }
    .swal-welcome-card b { color: #1E68E8; }
    .swal-badge { display: inline-block; padding: 6px 15px; border-radius: 20px; color: white; font-weight: bold; margin-bottom: 15px; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
  </style>
</head>
<body>

  <!-- شريط الأدوات العلوي -->
  <div class="top-toolbar">
    <div class="tool-group">
      <button class="btn-exit" onclick="window.history.back() || window.close()">
        <i class="fa-solid fa-arrow-right"></i> خروج
      </button>
      <div class="counter-badge" title="عدد البطاقات المسجلة اليوم">
        <i class="fa-solid fa-id-card"></i> <span id="scanCountValue" class="counter-val">0</span>
      </div>
    </div>

    <div class="tool-group">
      <button id="btnToggleFastMode" class="ctrl-btn active" title="وضع المسح السريع المتتابع (مفعل)" onclick="toggleFastMode()">
        <i class="fa-solid fa-bolt"></i>
      </button>
      <button id="btnToggleTorch" class="ctrl-btn" title="تشغيل / إيقاف الكشاف" onclick="toggleTorch()">
        <i class="fa-solid fa-lightbulb"></i>
      </button>
      <button id="btnSwitchCamera" class="ctrl-btn" title="تبديل الكاميرا" onclick="switchCamera()">
        <i class="fa-solid fa-camera-rotate"></i>
      </button>
      <button id="btnToggleSound" class="ctrl-btn active" title="الصوت التفاعلي" onclick="toggleSound()">
        <i class="fa-solid fa-volume-high"></i>
      </button>
    </div>
  </div>

  <!-- الترويسة -->
  <div class="header-info">
    <h1><i class="fa-solid fa-qrcode" style="color: #0FBA50;"></i> نظام المسح والتسجيل الذكي</h1>
    <p id="dateInfo">جاري التحقق من الرابط والأمان...</p>
  </div>

  <!-- إطار المسح والكاميرا -->
  <div class="scanner-wrapper">
    <div id="reader"></div>
    <div class="laser-line"></div>
    <div class="scan-corners">
      <div class="corner c-tl"></div>
      <div class="corner c-tr"></div>
      <div class="corner c-bl"></div>
      <div class="corner c-br"></div>
    </div>
  </div>

  <!-- التوجيه السفلي -->
  <div class="status-panel">
    <i class="fa-solid fa-expand"></i> 
    <span id="scanInstruction">وجّه الكاميرا نحو رمز QR الخاص بالبطاقة</span>
  </div>

  <!-- كرت المسح السريع الفوري -->
  <div id="quickScanCard" class="quick-scan-card" onclick="dismissQuickCard()">
    <img id="quickCardImg" class="quick-card-img" src="" alt="">
    <div class="quick-card-info">
      <div id="quickCardName" class="quick-card-name">-</div>
      <div id="quickCardSub" class="quick-card-sub">-</div>
      <div id="quickCardStatus" class="quick-card-status badge-present">-</div>
    </div>
  </div>

  <!-- مكتبة الماسح الرئيسية -->
  <script src="js/scanner.js" defer></script>

<script src="js/fcm-init.js" defer></script>
</body>
</html>
