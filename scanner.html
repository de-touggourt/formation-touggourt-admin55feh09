<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تسجيل الحضور الرقمي لمراكز التكوين</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- مكتبة ماسح الباركود الموثوقة لتفادي أخطاء التحميل -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <!-- إعدادات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { 
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
        color: white; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        overflow: hidden; 
    }
    
    .header { text-align: center; margin-bottom: 30px; z-index: 10; }
    .header h1 { font-size: 26px; color: #4facfe; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    .header p { font-size: 14px; color: #e0e0e0; margin-top: 5px; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; display: inline-block; }

    /* الحاوية الرئيسية للماسح */
    .scanner-container {
        position: relative;
        width: 90%;
        max-width: 350px;
        aspect-ratio: 1 / 1;
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(79, 172, 254, 0.4);
        background: #000;
        border: 4px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
    }

    #reader { width: 100%; height: 100%; }
    #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; border-radius: 26px; }
    
    /* إخفاء عناصر المكتبة الافتراضية إن وجدت */
    #reader__dashboard_section_csr, #reader__dashboard_section_swaplink { display: none !important; }

    /* تأثير خط الليزر */
    .laser-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: #0FBA50;
        box-shadow: 0 0 15px 5px rgba(15, 186, 80, 0.5);
        animation: scan 2s infinite linear;
        z-index: 10;
    }

    /* إطارات التوجيه في الزوايا */
    .scan-guide {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 5;
    }
    .scan-guide::before, .scan-guide::after, .scan-guide .bottom-guides::before, .scan-guide .bottom-guides::after {
        content: ''; position: absolute; width: 40px; height: 40px; border-color: rgba(255,255,255,0.8); border-style: solid;
    }
    .scan-guide::before { top: 20px; left: 20px; border-width: 4px 0 0 4px; border-radius: 10px 0 0 0; }
    .scan-guide::after { top: 20px; right: 20px; border-width: 4px 4px 0 0; border-radius: 0 10px 0 0; }
    .scan-guide .bottom-guides::before { bottom: 20px; left: 20px; border-width: 0 0 4px 4px; border-radius: 0 0 0 10px; }
    .scan-guide .bottom-guides::after { bottom: 20px; right: 20px; border-width: 0 4px 4px 0; border-radius: 0 0 10px 0; }

    @keyframes scan {
        0% { top: 10%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 90%; opacity: 0; }
    }

    .status-panel { 
        margin-top: 30px; 
        background: rgba(255, 255, 255, 0.1); 
        padding: 15px 25px; 
        border-radius: 20px; 
        text-align: center; 
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        z-index: 10;
    }
    
    .status-panel i { font-size: 20px; color: #4facfe; }

    .btn-back { 
        position: absolute; top: 20px; right: 20px; 
        background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); 
        color: white; padding: 10px 20px; border-radius: 15px; 
        cursor: pointer; font-weight: bold; font-family: 'Cairo';
        transition: 0.3s; backdrop-filter: blur(5px); z-index: 20;
        display: flex; align-items: center; gap: 8px;
    }
    .btn-back:hover { background: #d90429; box-shadow: 0 0 15px rgba(217, 4, 41, 0.5); border-color: transparent;}
    
    /* تصميم النافذة الترحيبية (كما برمجتها أنت) */
    .swal-welcome-card { text-align: right; line-height: 2; font-size: 15px; }
    .swal-welcome-card b { color: #1E68E8; }
    .swal-badge { display: inline-block; padding: 6px 15px; border-radius: 20px; color: white; font-weight: bold; margin-bottom: 15px; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    .badge-present { background: linear-gradient(45deg, #0FBA50, #0a8a3a); }
    .badge-late { background: linear-gradient(45deg, #ff9800, #e65100); }
  </style>
</head>
<body>

<div id="counterBadge" style="position: absolute; top: 20px; left: 20px; background: rgba(15, 186, 80, 0.85); color: white; padding: 10px 20px; border-radius: 15px; font-weight: bold; font-family: 'Cairo'; z-index: 20; border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 15px;">
    <i class="fa-solid fa-id-card"></i> البطاقات الممسوحة: <span id="scanCountValue" style="font-size: 20px; font-weight: 900; margin-right: 5px;">0</span>
</div>

  <button class="btn-back" onclick="window.close()"><i class="fa-solid fa-arrow-right"></i> رجوع</button>

  <div class="header">
    <h1><i class="fa-solid fa-camera-rotate"></i> نظام مسح البطاقات الشامل</h1>
    <p id="dateInfo">جاري تهيئة النظام...</p>
  </div>

  <div class="scanner-container">
    <div id="reader"></div>
    <div class="laser-line"></div>
    <div class="scan-guide">
        <div class="bottom-guides"></div>
    </div>
  </div>

  <div class="status-panel">
    <i class="fa-solid fa-qrcode"></i> 
    <span>قم بتوجيه الكاميرا نحو باركود البطاقة</span>
  </div>


  <script src="js/security.js" defer></script>
  <script src="js/scanner.js" defer></script>

</body>
</html>
