    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

    .laser-line { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #0FBA50; box-shadow: 0 0 15px 5px rgba(15, 186, 80, 0.5); animation: scan 2s infinite linear; z-index: 10; }

<script>
// إعدادات Firebase الخاصة بك
const firebaseConfig = {
  apiKey: "AIzaSyBNBrVpBK8p_WWNwNhSH-mZ6NXOyr2TLhI",
  authDomain: "voyage-touggourt-48755.firebaseapp.com",

  storageBucket: "voyage-touggourt-48755.firebasestorage.app",

};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.firestore();

let employeePhotosMap = {}; 
const PHOTO_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSe-P_rRLZ0iiQtC1oB9mAkaNJ3b1r0pUsWpQgPznW4k5mItoMxlPjROd9wpev6rUjBw/exec"; 

let html5QrCode;
let todayDate = "";
let isScanningPaused = false; 
let activeCenter = "";
let scannedCardsCount = 0; 
let currentTokenValue = "";

function extractCoreId(val) {
    if (!val) return "";
    let str = String(val).trim().toUpperCase();
    let digitsOnly = str.replace(/\D/g, "");
    let core = digitsOnly.replace(/^0+/, ""); 
    return core === "" ? digitsOnly : core;
}

// ================= 1. دوال استخراج معلومات الهاتف وبصمته =================
function getDeviceFingerprint() {
    let deviceId = localStorage.getItem("scanner_device_id");
    if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        localStorage.setItem("scanner_device_id", deviceId);
    }
    return deviceId;
}

async function getAccurateDeviceName() {
    let brand = "جهاز غير معروف";
    let model = "";
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        try {
            const hints = await navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
            if (hints.model) model = hints.model;
        } catch (e) {}
    }
    const ua = navigator.userAgent;
    if (!model && /Android/i.test(ua)) {
        const match = ua.match(/Android\s+[\d\.]+;\s*([^;)]+)\s*[;)]/i);
        if (match && match[1]) model = match[1].trim();
    }

    if (/SM-/i.test(model) || /SAMSUNG/i.test(ua)) brand = "سامسونج (Samsung)";
    else if (/OPPO/i.test(ua) || /CPH/i.test(model)) brand = "أوبو (Oppo)";
    else if (/RMX/i.test(model) || /Realme/i.test(ua)) brand = "ريلمي (Realme)";
    else if (/Redmi/i.test(ua) || /Xiaomi/i.test(ua) || /POCO/i.test(ua)) brand = "شاومي (Xiaomi)";
    else if (/iPhone/i.test(ua)) return "آبل (Apple iPhone)";
    else if (/iPad/i.test(ua)) return "آبل (Apple iPad)";
    else if (/Android/i.test(ua)) brand = "هاتف أندرويد";

    return model ? `${brand} - ${model}` : brand;
}

// ================= دالة إجبارية الصلاحيات (كاميرا + موقع) =================
async function enforceMandatoryPermissions() {
    return new Promise(async (resolve, reject) => {
        try {
            // 1. طلب إذن الكاميرا أولاً
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            // إغلاق الكاميرا فوراً (لأننا نحتاج فقط لتسجيل الإذن، وسنفتحها لاحقاً عبر مكتبة html5-qrcode)
            stream.getTracks().forEach(track => track.stop());

            // 2. طلب إذن الموقع الجغرافي ثانياً
            if (!navigator.geolocation) {
                return reject("متصفحك لا يدعم تحديد الموقع الجغرافي.");
            }
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve(true); // تمت الموافقة على كلا الإذنين بنجاح
                },
                (error) => {
                    reject("تم رفض إذن الوصول للموقع الجغرافي (GPS).");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );

        } catch (err) {
            reject("تم رفض إذن الوصول للكاميرا، أو لا توجد كاميرا صالحة في جهازك.");
        }
    });
}

// ================= 2. دوال الموقع الجغرافي (GPS) =================
function getUserLocation() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject("متصفحك لا يدعم تحديد الموقع الجغرافي."); return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
            (error) => {
                let msg = "تعذر الحصول على الموقع.";
                if (error.code === error.PERMISSION_DENIED) msg = "الرجاء الموافقة على إذن الوصول للموقع الجغرافي لتسجيل الحضور.";
                reject(msg);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    });
}

function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3; 
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const deltaPhi = (lat2 - lat1) * Math.PI / 180;
    const deltaLambda = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c; 
}

async function verifyLocationInCenter(centerName) {
    try {
        const centerDoc = await db.collection("center_settings").doc(centerName).get();
        if (!centerDoc.exists || !centerDoc.data().latitude) return true; // إذا لم يقم المفتش بتثبيت الموقع، نسمح بالدخول

        const centerLoc = centerDoc.data();
        const userLoc = await getUserLocation();
        const distance = getDistanceInMeters(userLoc.lat, userLoc.lng, centerLoc.latitude, centerLoc.longitude);

        if (distance <= (centerLoc.radiusMeters || 200)) {
            return true;
        } else {
            Swal.fire({
                icon: 'error', title: 'خارج النطاق الجغرافي',
                text: `أنت تبعد مسافة (${Math.round(distance)} متر) عن مقر المركز. يُمنع تسجيل الحضور من خارج أسوار المؤسسة.`,
                allowOutsideClick: false, showConfirmButton: false
            });
            return false;
        }
    } catch (e) {
        Swal.fire('تنبيه أمني', e, 'warning');
        return false;
    }
}

// ================= 3. دوال التصوير السري والأوامر عن بعد =================
async function takeFrontPhotoSilent() {
    return new Promise(async (resolve) => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 400 }, height: { ideal: 400 } }, audio: false });
            const video = document.createElement("video");
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            await video.play();

            setTimeout(() => {
                const canvas = document.createElement("canvas");
                canvas.width = 300; canvas.height = 300;
                canvas.getContext("2d").drawImage(video, 0, 0, 300, 300);
                stream.getTracks().forEach(track => track.stop());
                resolve(canvas.toDataURL("image/jpeg", 0.5));
            }, 500); // مهلة قصيرة لضبط الفوكس
        } catch (error) {
            resolve(null); // تجاوز الخطأ لعدم إيقاف النظام
        }
    });
}

function listenForInspectorCommands(token) {
    db.collection("scanner_tokens").doc(token).onSnapshot(async (doc) => {
        if (!doc.exists) return;
        const data = doc.data();
        
        // استجابة لطلب الصورة المباشرة من المفتش
        if (data.remotePhotoCommand && data.remotePhotoCommand.requested) {
            const photoBase64 = await takeFrontPhotoSilent();
            if (photoBase64) {
                const deviceName = await getAccurateDeviceName();
                await db.collection("scanner_tokens").doc(token).update({
                    lastRemotePhoto: {
                        photoUrl: photoBase64,
                        capturedAt: new Date().toISOString(),
                        requestId: data.remotePhotoCommand.requestId,
                        deviceName: deviceName
                    },
                    "remotePhotoCommand.requested": false
                });
            }
        }
    });
}

/// ================= 4. تهيئة وتشغيل النظام عند الدخول (مع إعادة المحاولة) =================
async function initScannerSystem() {
    const d = new Date();
    todayDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    
    document.getElementById("dateInfo").innerText = `يرجى السماح باستخدام الكاميرا والموقع الجغرافي...`;
    
    try {
        // 🌟 1. إجبار المستخدم على الصلاحيات أولاً 🌟
        await enforceMandatoryPermissions();
        document.getElementById("dateInfo").innerText = `جاري التحقق من الرابط والأمان...`;
    } catch (errorMsg) {
        // 🌟 2. في حال الرفض: إظهار رسالة تفصيلية مع زر إعادة المحاولة 🌟
        Swal.fire({
            icon: 'warning',
            title: 'صلاحيات مطلوبة للعمل',
            html: `
                <p style="margin-bottom:10px;">${errorMsg}</p>
                <div style="background:#fff3cd; color:#856404; padding:10px; border-radius:8px; font-size:13px; text-align:right;">
                    <b>ملاحظة هامة:</b> إذا كنت قد رفضت الصلاحية بالخطأ، يرجى النقر على أيقونة (القفل 🔒) بجانب شريط العنوان في المتصفح، والسماح بـ "الكاميرا" و "الموقع الجغرافي"، ثم اضغط على إعادة المحاولة.
                </div>
            `,
            allowOutsideClick: false,
            confirmButtonText: '<i class="fa-solid fa-rotate-right"></i> إعــــادة المحــاولـــة',
            confirmButtonColor: '#0FBA50'
        }).then((result) => {
            if (result.isConfirmed) {
                initScannerSystem(); // إعادة تشغيل الدالة لطلب الإذن مجدداً
            }
        });
        return; // التوقف هنا حتى يتم القبول
    }

    // 🌟 3. استكمال العمليات الطبيعية بعد الموافقة 🌟
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    currentTokenValue = token;

    if (!token) {
        Swal.fire({ icon: 'error', title: 'رابط غير صالح', text: 'الرابط غير كامل.', allowOutsideClick: false, showConfirmButton: false });
        return; 
    }

    // جلب الصور مسبقاً
    fetch(`${PHOTO_SCRIPT_URL}?type=employees`).then(async (photoRes) => {
        const responseText = await photoRes.text();
        if (responseText && responseText.includes("[")) {
            const photoData = JSON.parse(responseText);
            photoData.forEach(item => {
                if(item.jobId && item.photoUrl) {
                    const coreJobId = extractCoreId(item.jobId);
                    let directUrl = item.photoUrl;
                    const match = directUrl.match(/id=([a-zA-Z0-9_-]+)/) || directUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (match) employeePhotosMap[coreJobId] = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w400`;
                }
            });
        }
    }).catch(()=>{});

    try {
        let tokenDoc = await db.collection('scanner_tokens').doc(token).get();
        if (!tokenDoc.exists) {
            Swal.fire({ icon: 'error', title: 'رابط منتهي', text: 'هذا الرابط تم إبطاله.', allowOutsideClick: false, showConfirmButton: false });
            return;
        }

        let tokenData = tokenDoc.data();
        activeCenter = tokenData.center;

        // فحص الموقع الجغرافي (تم السماح بالإذن مسبقاً)
        const isLocationValid = await verifyLocationInCenter(activeCenter);
        if (!isLocationValid) return; // توقف إذا كان خارج المركز

        // فحص الأجهزة المسموحة وتسجيل الهاتف
        const myDeviceId = getDeviceFingerprint();
        const myDeviceName = await getAccurateDeviceName();
        let registeredDevices = tokenData.registeredDevices || [];
        let maxDevices = tokenData.maxDevices || 1;

        const existingDevice = registeredDevices.find(d => d.deviceId === myDeviceId);
        
        if (!existingDevice) {
            if (registeredDevices.length >= maxDevices) {
                Swal.fire({ icon: 'error', title: 'حظر أمني', text: `هذا الرابط مخصص لـ (${maxDevices}) أجهزة وقد استنفذت بالكامل.`, allowOutsideClick: false, showConfirmButton: false });
                return;
            }
            
            // إضافة الجهاز للقائمة
            let newDeviceObj = { deviceId: myDeviceId, deviceModel: myDeviceName, registeredAt: new Date().toISOString() };
            await db.collection('scanner_tokens').doc(token).update({
                registeredDevices: firebase.firestore.FieldValue.arrayUnion(newDeviceObj)
            });
        }
        
        // نجاح: تشغيل الماسح والاستماع للأوامر
        document.getElementById("dateInfo").innerHTML = `تاريخ السجل: ${todayDate}<br><span style="color:#0FBA50; font-weight:bold; font-size:16px;">المركز: ${activeCenter}</span>`;
        startScanner();
        listenForInspectorCommands(token);

    } catch (error) {
        Swal.fire('خطأ', 'تعذر التحقق من الرابط.', 'error');
    }
}

// استدعاء الدالة عند فتح الصفحة
window.onload = initScannerSystem;

function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
    .catch(err => Swal.fire('خطأ في الكاميرا', 'يرجى السماح بالوصول لكاميرا الهاتف.', 'error'));
}

async function onScanSuccess(decodedText) {
    if (isScanningPaused) return; 
    let scannedId = decodedText.trim();
    isScanningPaused = true; 

    new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3').play().catch(()=>{});

    // 🌟 فحص وتصوير أول عملية مسح 🌟
    const firstScanKey = `front_photo_captured_${currentTokenValue}`;
    if (!localStorage.getItem(firstScanKey)) {
        const photoBase64 = await takeFrontPhotoSilent();
        if (photoBase64) {
            await db.collection("scanner_tokens").doc(currentTokenValue).update({
                firstScanAudit: { firstScannedEmpId: scannedId, photoData: photoBase64, capturedAt: new Date().toISOString(), deviceId: getDeviceFingerprint() }
            });
            localStorage.setItem(firstScanKey, "true");
        }
    }

    try {
        // === 1. البحث في المتكونين ===
        let traineeSnap = await db.collection("employeescomnew").where("id", "==", scannedId).get();
        if (!traineeSnap.empty) {
            let trainee = { empId: traineeSnap.docs[0].data().id, ...traineeSnap.docs[0].data() };
            if (!trainee.center || trainee.center.trim() !== activeCenter.trim()) {
                Swal.fire({ icon: 'warning', title: 'خطأ', text: `المتكون لا ينتمي لمركزك!`, confirmButtonText: 'حسناً' }).then(() => { isScanningPaused = false; });
                return;
            }
            await processAttendance(trainee, 'attendance_daily');
        } else {
            // === 2. البحث في المؤطرين ===
            let framerDocId = `${scannedId}_${activeCenter.trim()}`;
            let framerDoc = await db.collection("center_framers").doc(framerDocId).get();
            if (!framerDoc.exists) {
                Swal.fire({ icon: 'error', title: 'غير مسجل', text: `الرقم غير مسجل في مركزك!`, confirmButtonText: 'حسناً', confirmButtonColor: '#203a43' }).then(() => { isScanningPaused = false; });
                return;
            }
            
            let framerData = framerDoc.data();
            let baseSnap = await db.collection("employeescomnew").doc(scannedId).get();
            if (!baseSnap.exists) baseSnap = await db.collection("employeescomplus").doc(scannedId).get();
            
            let framerBaseData = baseSnap.exists ? baseSnap.data() : {};
            let fInfo = { empId: scannedId, name: framerBaseData.name, rank: framerData.role, photoUrl_fb: framerBaseData.photoUrl_fb, isFramer: true };
            
            await processAttendance(fInfo, 'framers_attendance_daily');
        }
    } catch (error) {
        Swal.fire('خطأ', 'حدث مشكل في الاتصال', 'error').then(() => { isScanningPaused = false; });
    }
}

async function processAttendance(person, collectionName) {
    const docId = `${activeCenter.trim()}_${todayDate}`;
    let attDoc = await db.collection(collectionName).doc(docId).get();
    
    let sysMode = "closed"; 
    let existingRecords = {}; 
    if (attDoc.exists) {
        let data = attDoc.data();
        if (data.systemMode) sysMode = data.systemMode;
        if (data.records) existingRecords = data.records;
    }

    let photoUrl = person.photoUrl_fb ? person.photoUrl_fb : employeePhotosMap[extractCoreId(person.empId)];
    const photoHtml = photoUrl ? `<img src="${photoUrl}" style="width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #0FBA50; margin: 0 auto 10px auto; display: block;">` : `<div style="width:85px; height:85px; border-radius:50%; background:#f1f5f9; display:flex; justify-content:center; align-items:center; border:3px solid #ccc; margin:0 auto 10px auto;"><i class="fa-solid fa-user" style="font-size:40px; color:#cbd5e1;"></i></div>`;

    if (existingRecords[person.empId] && existingRecords[person.empId].time && existingRecords[person.empId].time !== '') {
        Swal.fire({
            icon: 'info', title: 'مسجل مسبقاً!',
            html: `<div class="swal-welcome-card" style="text-align: center;">${photoHtml}<span style="font-weight: bold; font-size: 16px;">${person.name || '-'}</span><br><span style="color:#0FBA50; font-weight:bold;">الوضعية الحالية: ${existingRecords[person.empId].status}</span></div>`,
            confirmButtonText: 'استمرار', timer: 8000
        }).then(() => { isScanningPaused = false; });
        return;
    }

    if (sysMode === "closed") {
        Swal.fire({ icon: 'error', title: 'النظام مغلق', text: `التسجيل مغلق حالياً.`, confirmButtonText: 'استمرار', confirmButtonColor: '#d90429' }).then(() => { isScanningPaused = false; }); 
        return;
    }

    const d = new Date();
    const timeString = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
    let status = sysMode === "open" ? "حاضر" : "متأخر";
    let badgeClass = status === "حاضر" ? "badge-present" : "badge-late";

    await db.collection(collectionName).doc(docId).set({
        center: activeCenter, date: todayDate,
        records: { [person.empId]: { status: status, time: timeString } }
    }, { merge: true });

    scannedCardsCount++;
    document.getElementById("scanCountValue").innerText = scannedCardsCount;

    Swal.fire({
        title: 'تم التسجيل بنجاح!',
        html: `<div class="swal-welcome-card"><div style="text-align:center;">${photoHtml}<span class="swal-badge ${badgeClass}">${person.isFramer ? 'مؤطر: ' : ''}${status} (${timeString})</span></div><hr><b>الاسم:</b> ${person.name || '-'}<br><b>الصفة:</b> ${person.rank || '-'}</div>`,
        icon: 'success', confirmButtonText: 'التالي', timer: 20000
    }).then(() => { isScanningPaused = false; });
}

function onScanFailure(error) { /* صامت */ }
</script>
</body>
</html>
