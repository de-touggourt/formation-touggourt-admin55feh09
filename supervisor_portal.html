<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>فضاء الأستاذ المؤطر - إدارة ورفع الملفات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: #f4f7f6;
      background-image: radial-gradient(#1E68E8 0.5px, transparent 0.5px), radial-gradient(#1E68E8 0.5px, #f4f7f6 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: #102a43;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* الشريط العلوي */
    .top-bar {
      background: #0d47a1;
      color: #fff;
      padding: 6px 20px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .btn-logout {
      background: #dc2626;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo';
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }
    .btn-logout:hover { background: #b91c1c; }

    /* الهيدر وبطاقة الأستاذ */
    .hero-header {
      background: linear-gradient(135deg, #1E68E8 0%, #0d47a1 100%);
      color: white;
      padding: 30px 20px 50px 20px;
      border-bottom-left-radius: 35px;
      border-bottom-right-radius: 35px;
      box-shadow: 0 10px 30px rgba(30, 104, 232, 0.2);
    }

    .profile-card {
      max-width: 1050px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 22px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 280px;
    }

    .avatar-wrapper {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: white;
      border: 3px solid #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { font-size: 32px; color: #1E68E8; }

    .profile-meta h1 {
      margin: 0 0 5px 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .profile-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge-tag {
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* الحاوية الرئيسية */
    .main-content {
      max-width: 1050px;
      width: 100%;
      margin: -25px auto 40px auto;
      padding: 0 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* قسم اختيار المركز */
    .section-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
    }
    .section-title i { color: #1E68E8; font-size: 20px; }

    /* شبكة المراكز التابعة */
    .centers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .center-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .center-card:hover {
      border-color: #1E68E8;
      background: #f0f7ff;
      transform: translateY(-2px);
    }
    .center-card.active {
      border-color: #1E68E8;
      background: #eff6ff;
      box-shadow: 0 4px 12px rgba(30,104,232,0.15);
    }
    .center-card.active .center-icon {
      background: #1E68E8;
      color: white;
    }
    .center-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #e2e8f0;
      color: #102a43;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      transition: 0.2s;
    }
    .center-info { flex: 1; text-align: right; }
    .center-name { font-weight: 800; font-size: 15px; color: #0f172a; margin-bottom: 3px; }
    .center-status { font-size: 12px; font-weight: 700; color: #16a34a; display: flex; align-items: center; gap: 4px; }

    /* تفاصيل التكليف بالمركز الحالي */
    .assignment-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-label { font-size: 12px; font-weight: 700; color: #64748b; }
    .detail-val { font-size: 14px; font-weight: 800; color: #0f172a; }

    /* شبكة المقاييس */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .module-card {
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .module-card:hover {
      border-color: #1E68E8;
      box-shadow: 0 8px 20px rgba(30,104,232,0.1);
      transform: translateY(-3px);
    }
    .module-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 12px;
    }
    .module-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #e0f2fe;
      color: #0284c7;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }
    .module-title { font-size: 16px; font-weight: 800; color: #0f172a; margin: 0; }

    /* أزرار الدورات التكوينية */
    .cycles-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cycle-row-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      transition: 0.2s;
      color: #1e293b;
    }
    .cycle-row-btn:hover:not(.closed) {
      background: #1E68E8;
      color: white;
      border-color: #1E68E8;
    }
    .cycle-row-btn.closed {
      opacity: 0.6;
      cursor: not-allowed;
      background: #f1f5f9;
      color: #94a3b8;
    }
    .cycle-status-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 800;
    }
    .pill-open { background: #dcfce7; color: #15803d; }
    .cycle-row-btn:hover:not(.closed) .pill-open { background: rgba(255,255,255,0.25); color: #fff; }
    .pill-closed { background: #fee2e2; color: #b91c1c; }

    /* تنسيقات نافذة الملفات داخل SweetAlert2 */
    .file-manager-container { text-align: right; direction: rtl; font-family: 'Cairo', sans-serif; }
    .fm-header-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .fm-search-box { position: relative; flex: 1; min-width: 200px; }
    .fm-search-box input { width: 100%; padding: 8px 32px 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-family: 'Cairo'; outline: none; font-size: 13px; }
    .fm-search-box i { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
    
    .fm-upload-panel {
      background: #f0f7ff;
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .upload-btn-real {
      background: #1E68E8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Cairo';
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .upload-btn-real:hover { filter: brightness(0.95); transform: translateY(-1px); }

    .fm-files-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
      padding: 4px;
    }
    .fm-file-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .fm-file-top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .fm-file-icon { font-size: 24px; color: #dc2626; }
    .fm-file-info { flex: 1; overflow: hidden; }
    .fm-file-title { font-weight: 700; font-size: 13px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fm-file-meta { font-size: 11px; color: #64748b; }
    .fm-file-actions { display: flex; gap: 6px; justify-content: flex-end; border-top: 1px solid #f1f5f9; padding-top: 8px; }
    .btn-fm-act { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-decoration: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .btn-fm-preview { background: #e0f2fe; color: #0369a1; }
    .btn-fm-download { background: #dcfce7; color: #15803d; }
    .btn-fm-delete { background: #fee2e2; color: #dc2626; }

    #loader {
      display: flex;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.95);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .spinner {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #1E68E8;
      border-radius: 50%;
      width: 48px; height: 48px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- شاشة التحميل -->
  <div id="loader">
    <div class="spinner"></div>
    <h3 style="color: #102a43; margin-top: 15px; font-weight: 800;">جاري تحميل فضاء الأستاذ المؤطر...</h3>
  </div>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div>
      <i class="fa-solid fa-graduation-cap"></i> فضاء التكوين البيداغوجي - مديرية التربية لولاية توقرت
    </div>
    <button class="btn-logout" onclick="logoutSupervisor()">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج
    </button>
  </div>

  <!-- الهيدر وبطاقة الأستاذ -->
  <div class="hero-header">
    <div class="profile-card">
      <div class="profile-info">
        <div class="avatar-wrapper">
          <img id="supAvatar" src="" class="avatar-img" style="display:none;" alt="صورة">
          <i id="supPlaceholder" class="fa-solid fa-chalkboard-user avatar-placeholder"></i>
        </div>
        <div class="profile-meta">
          <h1 id="supName">أستاذ مؤطر</h1>
          <div class="profile-badges">
            <span class="badge-tag"><i class="fa-solid fa-id-card"></i> <span id="supEmpId">...</span></span>
            <span class="badge-tag"><i class="fa-solid fa-award"></i> <span id="supRank">...</span></span>
            <span class="badge-tag"><i class="fa-solid fa-school"></i> <span id="supWorkplace">...</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="main-content">

    <!-- قسم مراكز التكليف -->
    <div class="section-card">
      <h2 class="section-title">
        <i class="fa-solid fa-map-location-dot"></i> 
        مراكز التكليف بالتأطير (المعتمدة لحسابك)
      </h2>
      <div class="centers-grid" id="centersContainer">
        <!-- يتم ملؤها عبر JavaScript -->
      </div>
    </div>

    <!-- قسم تفاصيل التكليف والمقاييس المتاحة للرفع -->
    <div class="section-card">
      <h2 class="section-title">
        <i class="fa-solid fa-folder-open"></i> 
        المقاييس المسندة ورفع الملفات البيداغوجية
      </h2>

      <!-- تفاصيل المركز المختار -->
      <div class="assignment-details" id="assignmentDetailsBox">
        <div class="detail-item">
          <span class="detail-label">المركز الحالي:</span>
          <span class="detail-val" id="detCenterName">-</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">التخصصات المكلف بها:</span>
          <span class="detail-val" id="detSpecs">-</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">الرتب والأطوار المستهدفة:</span>
          <span class="detail-val" id="detRanks">-</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">الأفواج المشرف عليها:</span>
          <span class="detail-val" id="detGroups">-</span>
        </div>
      </div>

      <!-- شبكة مقاييس الأستاذ فقط -->
      <div class="modules-grid" id="modulesContainer">
        <!-- يتم ملء بطاقات المقاييس المكلف بها هنا -->
      </div>
    </div>

  </div>

  <script src="js/sys-shield-v2.js" defer></script>
  <script src="js/supervisor_portal.js" defer></script>
</body>
</html>
